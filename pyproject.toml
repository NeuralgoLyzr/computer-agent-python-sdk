[project]
name = "computer-agent-py"
version = "0.2.2"
description = "Drop-in replacement for claude-agent-sdk that adds a proxied telemetry pipeline (PII redaction + guardrails) with OpenTelemetry and AgentOS sinks."
authors = [
    { name = "Abhi Bhat", email = "abhishek.bhat@lyzr.ai" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["computeragent", "claude-agent-sdk", "claude", "agent", "telemetry", "otel", "opentelemetry", "agentos", "pii"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "claude-agent-sdk>=0.2,<0.3",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
]
agentos = [
    "httpx>=0.27",
]
remote = [
    "httpx>=0.27",
]
cedar = [
    "cedarpy>=4,<5",
]
gitagent = [
    "openai>=1,<2",
    "anthropic>=0.40,<1",
    "pyyaml>=6,<7",
]
gap = [
    "pyyaml>=6,<7",
]
sqlite = [
    "aiosqlite>=0.20,<1",
]
all = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
    "httpx>=0.27",
    "cedarpy>=4,<5",
    "openai>=1,<2",
    "anthropic>=0.40,<1",
    "pyyaml>=6,<7",
    "aiosqlite>=0.20,<1",
]

[project.urls]
Homepage = "https://github.com/open-gitagent/computer-agent-py"
Issues = "https://github.com/open-gitagent/computer-agent-py/issues"
Changelog = "https://github.com/open-gitagent/computer-agent-py/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

# The PyPI distribution is `computer-agent-py` but the import name stays
# `computeragent` so the drop-in for `claude_agent_sdk` is a single import
# line change.  uv_build derives the package directory from the project
# name by default — override it to point at `src/computeragent/`.
[tool.uv.build-backend]
module-name = "computeragent"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-semantic-conventions>=0.48b0",
    "cedarpy>=4,<5",
    "openai>=1,<2",
    "anthropic>=0.40,<1",
    "pyyaml>=6,<7",
    "aiosqlite>=0.20,<1",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "UP",
    "B",
    "ASYNC",
    "RET",
    "SIM",
    "TCH",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "ASYNC", "TC001", "TC003"]
"examples/**" = ["E501"]
"src/computeragent/__init__.py" = ["F401", "F403"]
"src/computeragent/types.py" = ["F401", "F403"]
# 0.2.0 harness layer: protocol value types are referenced from both
# annotations and runtime code (isinstance, dataclass field defaults).
# TYPE_CHECKING-only imports would break runtime; ignore the TC nudges.
"src/computeragent/harness/**" = ["TC001", "TC003", "SIM101"]
"src/computeragent/engines/**" = ["TC001", "TC003"]
"src/computeragent/substrates/**" = ["TC003"]
"src/computeragent/identity/**" = ["TC003"]
"src/computeragent/session_stores/**" = ["TC001"]
"src/computeragent/protocol_types/**" = ["TC003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: requires real Claude CLI and credentials",
]
